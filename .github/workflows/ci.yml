name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Run action
        uses: ./
        with:
          sensitive: true
          large: true

  action:
    name: Action behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Run with default inputs
        uses: ./
      - name: Create optional finding fixtures
        run: |
          touch .env.action-test
          truncate -s 10M action-large.bin
      - name: Ignore optional findings by default
        uses: ./
      - name: Find sensitive path
        id: sensitive
        continue-on-error: true
        uses: ./
        with:
          sensitive: true
      - name: Find large file
        id: large
        continue-on-error: true
        uses: ./
        with:
          large: true
      - name: Create mismatch fixture
        run: |
          echo action-mismatch.txt > .gitignore
          touch action-mismatch.txt
      - name: Find context mismatch
        id: mismatch
        continue-on-error: true
        uses: ./
      - name: Check expected failures
        if: always()
        env:
          SENSITIVE_OUTCOME: ${{ steps.sensitive.outcome }}
          LARGE_OUTCOME: ${{ steps.large.outcome }}
          MISMATCH_OUTCOME: ${{ steps.mismatch.outcome }}
        run: |
          test "$SENSITIVE_OUTCOME" = failure
          test "$LARGE_OUTCOME" = failure
          test "$MISMATCH_OUTCOME" = failure
